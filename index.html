<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>바다 낭만</title>
<meta property="og:title" content="바다 낭만">
<meta property="og:description" content="11/21–22 · 9명 · 숙소 한눈에 비교">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="title"><b>바다 낭만</b><span id="tripInfo"></span></div>
  <button id="who" class="who" type="button"></button>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="map" class="on">지도</button>
  <button data-tab="list">목록</button>
  <button data-tab="activity">액티비티</button>
  <button data-tab="compare">비교 <i id="cmpCount"></i></button>
</nav>

<div class="filters" id="filters">
  <div class="chips" data-group="source">
    <button data-v="all" class="on">전체</button>
    <button data-v="search">검색 결과</button>
    <button data-v="ai">AI 추천</button>
    <button data-v="new">NEW</button>
    <button data-v="best">THE BEST</button>
  </div>
  <div class="chips" data-group="type">
    <button data-v="all" class="on">전체</button>
    <button data-v="sea">바다</button>
    <button data-v="mountain">산</button>
  </div>
  <label class="toggle" id="actToggle"><input type="checkbox" id="showAct" checked> 액티비티</label>
  <label class="toggle"><input type="checkbox" id="ocean"> 오션뷰</label>
  <label class="toggle"><input type="checkbox" id="showArch"> 보관함 보기</label>
</div>

<main>
  <section id="view-map"><div id="map"></div><div id="mapMsg" class="mapmsg" hidden></div></section>
  <section id="view-list" hidden></section>
  <section id="view-activity" hidden></section>
  <section id="view-compare" hidden></section>
</main>

<div id="sheetBg" class="sheetbg" hidden></div>
<aside id="sheet" class="sheet" hidden></aside>

<script type="module" src="js/app.js"></script>
</body>
</html>
